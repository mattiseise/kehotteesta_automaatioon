<div style="display:flex;align-items:center;gap:56px"><div style="flex:none;display:flex;gap:28px;--k-teksti:#FFFFFF;--k-himmea:#CFC9DC;--k-viiva:#CFC9DC;--k-agentti:#B9A6FF;--k-linja:#56D3C6;--k-tark:#B9A6FF;--k-portti:#E8B648;--k-oma:#F590B4;font-family:'Montserrat', Arial, sans-serif"><div style="flex:none;box-sizing:border-box;width:469px;height:640px;background:#2A1446;padding:12px 16px"><svg style="display:block;width:437px;height:616px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 620" role="img" aria-labelledby="kvd-y-t kvd-y-d" font-family="inherit"><title id="kvd-y-t">Yleisagentti</title><desc id="kvd-y-d">Ihminen antaa tavoitteen ja rajat. Agentti käyttää tarpeen mukaan muistia, työkaluja, sovelluksia ja omaa suunnitteluaan ja tuottaa tuloksen, jota tarkastellaan ja josta annetaan palautetta. Agentti päättää itse, miten etenee, joten tyyli ja sisältö vaihtelevat kerrasta toiseen.</desc><style>.kv-t{fill:var(--k-teksti,#1A0530);font-family:inherit}.kv-h{fill:var(--k-himmea,#5F596C);font-family:inherit}.kv-n{fill:none;stroke:var(--k-viiva,#8C84A0);stroke-width:2}</style><defs><marker id="kvd-n1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--k-viiva,#8C84A0)"/></marker></defs><text class="kv-t" x="220" y="34" text-anchor="middle" font-size="28" font-weight="700">Yleisagentti</text><text class="kv-h" x="220" y="62" text-anchor="middle" font-size="18">esim. Claude Cowork tai ChatGPT:n dot</text><rect x="50" y="88" width="340" height="54" rx="8" fill="var(--k-viiva,#8C84A0)" fill-opacity=".14" stroke="var(--k-viiva,#8C84A0)" stroke-width="2.5"/><text class="kv-t" text-anchor="middle" font-size="21" font-weight="600"><tspan x="220" y="122">Tavoite ja rajat</tspan></text><path class="kv-n" d="M220 142 V200" marker-end="url(#kvd-n1)"/><path d="M130 196 L170 232" stroke="var(--k-agentti,#6B4FD8)" stroke-width="2" stroke-dasharray="5 5" fill="none"/><rect x="2" y="172" width="128" height="48" rx="8" fill="var(--k-agentti,#6B4FD8)" fill-opacity=".14" stroke="var(--k-agentti,#6B4FD8)" stroke-width="2.5" stroke-dasharray="6 5"/><text class="kv-t" text-anchor="middle" font-size="18" font-weight="500"><tspan x="66" y="202">Muisti</tspan></text><path d="M310 196 L270 232" stroke="var(--k-agentti,#6B4FD8)" stroke-width="2" stroke-dasharray="5 5" fill="none"/><rect x="310" y="172" width="128" height="48" rx="8" fill="var(--k-agentti,#6B4FD8)" fill-opacity=".14" stroke="var(--k-agentti,#6B4FD8)" stroke-width="2.5" stroke-dasharray="6 5"/><text class="kv-t" text-anchor="middle" font-size="18" font-weight="500"><tspan x="374" y="202">Työkalut</tspan></text><path d="M130 330 L170 292" stroke="var(--k-agentti,#6B4FD8)" stroke-width="2" stroke-dasharray="5 5" fill="none"/><rect x="2" y="306" width="128" height="48" rx="8" fill="var(--k-agentti,#6B4FD8)" fill-opacity=".14" stroke="var(--k-agentti,#6B4FD8)" stroke-width="2.5" stroke-dasharray="6 5"/><text class="kv-t" text-anchor="middle" font-size="18" font-weight="500"><tspan x="66" y="336">Sovellukset</tspan></text><path d="M310 330 L270 292" stroke="var(--k-agentti,#6B4FD8)" stroke-width="2" stroke-dasharray="5 5" fill="none"/><rect x="310" y="306" width="128" height="48" rx="8" fill="var(--k-agentti,#6B4FD8)" fill-opacity=".14" stroke="var(--k-agentti,#6B4FD8)" stroke-width="2.5" stroke-dasharray="6 5"/><text class="kv-t" text-anchor="middle" font-size="18" font-weight="500"><tspan x="374" y="336">Suunnittelu</tspan></text><circle cx="220" cy="262" r="60" fill="var(--k-agentti,#6B4FD8)" fill-opacity=".2" stroke="var(--k-agentti,#6B4FD8)" stroke-width="3"/><text class="kv-t" x="220" y="270" text-anchor="middle" font-size="23" font-weight="700">Agentti</text><path class="kv-n" d="M220 322 V398" marker-end="url(#kvd-n1)"/><rect x="30" y="400" width="380" height="66" rx="8" fill="var(--k-viiva,#8C84A0)" fill-opacity=".14" stroke="var(--k-viiva,#8C84A0)" stroke-width="2.5"/><text class="kv-t" text-anchor="middle" font-size="21" font-weight="600"><tspan x="220" y="427">Tulos, tarkastelu</tspan><tspan x="220" y="453">ja palaute</tspan></text><text class="kv-t" x="220" y="516" text-anchor="middle" font-size="19">Agentti päättää itse, miten etenee.</text><text class="kv-t" x="220" y="543" text-anchor="middle" font-size="19">Tyyli ja sisältö vaihtelevat</text><text class="kv-t" x="220" y="570" text-anchor="middle" font-size="19">kerrasta toiseen.</text></svg></div><div style="flex:none;box-sizing:border-box;width:469px;height:640px;background:#2A1446;padding:12px 16px"><svg style="display:block;width:437px;height:616px" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 620" role="img" aria-labelledby="kvd-l-t kvd-l-d" font-family="inherit"><title id="kvd-l-t">Agenttilinjasto</title><desc id="kvd-l-d">Ihminen antaa tavoitteen ja kriteerit. Työ kulkee kolmen aseman läpi: suunnittelu, tuotanto ja tarkastus. Tuotanto on sellainen agentti kuin osallistuja teki tänään. Jos kriteerit eivät täyty, työ palaa korjattavaksi tuotantoon. Jos ne täyttyvät, ihminen hyväksyy lopputuloksen. Vaiheet ja tarkastus päätetään etukäteen. Teksti vaihtelee, mutta jokainen vaihe tarkistetaan.</desc><style>.kv-t{fill:var(--k-teksti,#1A0530);font-family:inherit}.kv-h{fill:var(--k-himmea,#5F596C);font-family:inherit}.kv-n{fill:none;stroke:var(--k-viiva,#8C84A0);stroke-width:2}</style><defs><marker id="kvd-n2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="var(--k-viiva,#8C84A0)"/></marker></defs><text class="kv-t" x="220" y="34" text-anchor="middle" font-size="28" font-weight="700">Agenttilinjasto</text><text class="kv-h" x="220" y="62" text-anchor="middle" font-size="18">esim. pedagoginen agenttiputki</text><rect x="34" y="88" width="250" height="50" rx="8" fill="var(--k-viiva,#8C84A0)" fill-opacity=".14" stroke="var(--k-viiva,#8C84A0)" stroke-width="2.5"/><text class="kv-t" text-anchor="middle" font-size="20" font-weight="600"><tspan x="159" y="120">Tavoite ja kriteerit</tspan></text><path class="kv-n" d="M159 138 V156" marker-end="url(#kvd-n2)"/><rect x="34" y="158" width="250" height="46" rx="8" fill="var(--k-linja,#0F766E)" fill-opacity=".14" stroke="var(--k-linja,#0F766E)" stroke-width="2.5"/><text class="kv-t" text-anchor="middle" font-size="21" font-weight="600"><tspan x="159" y="188">1  Suunnittelu</tspan></text><path class="kv-n" d="M159 204 V222" marker-end="url(#kvd-n2)"/><rect x="34" y="224" width="250" height="46" rx="8" fill="var(--k-linja,#0F766E)" fill-opacity=".14" stroke="var(--k-linja,#0F766E)" stroke-width="2.5"/><text class="kv-t" text-anchor="middle" font-size="21" font-weight="600"><tspan x="159" y="254">2  Tuotanto</tspan></text><path d="M284 247 H300" stroke="var(--k-oma,#B4235A)" stroke-width="2.5" fill="none"/><rect x="300" y="216" width="134" height="62" rx="8" fill="var(--k-oma,#B4235A)" fill-opacity=".14" stroke="var(--k-oma,#B4235A)" stroke-width="2.5"/><text class="kv-t" text-anchor="middle" font-size="18" font-weight="600"><tspan x="367" y="242">Sinun</tspan><tspan x="367" y="264">agenttisi</tspan></text><path class="kv-n" d="M159 270 V288" marker-end="url(#kvd-n2)"/><rect x="34" y="290" width="250" height="46" rx="8" fill="var(--k-tark,#6B4FD8)" fill-opacity=".14" stroke="var(--k-tark,#6B4FD8)" stroke-width="2.5"/><text class="kv-t" text-anchor="middle" font-size="21" font-weight="600"><tspan x="159" y="320">3  Tarkastus</tspan></text><path class="kv-n" d="M159 336 V350" marker-end="url(#kvd-n2)"/><path d="M159 352 L255 398 L159 444 L63 398 Z" fill="var(--k-portti,#96650A)" fill-opacity=".16" stroke="var(--k-portti,#96650A)" stroke-width="2.5"/><text class="kv-t" x="159" y="395" text-anchor="middle" font-size="18" font-weight="600">Kriteerit</text><text class="kv-t" x="159" y="417" text-anchor="middle" font-size="18" font-weight="600">täyttyvät?</text><path d="M63 398 H12 V247 H32" fill="none" stroke="var(--k-portti,#96650A)" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#kvd-n2)"/><text class="kv-t" x="4" y="426" font-size="19" font-weight="600">Ei:</text><text class="kv-t" x="4" y="449" font-size="19" font-weight="600">korjaus</text><path class="kv-n" d="M159 444 V468" marker-end="url(#kvd-n2)"/><text class="kv-t" x="171" y="465" font-size="19" font-weight="600">Kyllä</text><rect x="34" y="470" width="250" height="50" rx="8" fill="var(--k-viiva,#8C84A0)" fill-opacity=".14" stroke="var(--k-viiva,#8C84A0)" stroke-width="2.5"/><text class="kv-t" text-anchor="middle" font-size="20" font-weight="600"><tspan x="159" y="502"></tspan></text><text class="kv-t" x="175" y="502" text-anchor="middle" font-size="20" font-weight="600">Ihminen hyväksyy</text><circle cx="64" cy="486" r="7" fill="var(--k-teksti,#1A0530)"/><path d="M51 511 Q64 492 77 511 Z" fill="var(--k-teksti,#1A0530)"/><text class="kv-t" x="220" y="556" text-anchor="middle" font-size="19">Vaiheet ja tarkastus päätetään etukäteen.</text><text class="kv-t" x="220" y="583" text-anchor="middle" font-size="19">Teksti vaihtelee, mutta jokainen</text><text class="kv-t" x="220" y="610" text-anchor="middle" font-size="19">vaihe tarkistetaan.</text></svg></div></div><p style="font-size:36px;line-height:1.4;color:#FFFFFF">Rakensit tänään yhden aseman: agentin, jolla on ohjeet, tiedot ja rajat.</p></div>
