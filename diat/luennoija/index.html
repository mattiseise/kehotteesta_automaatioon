<script type="application/json" id="dia-data">{"title": "Luennoijan diat · Kehotteesta automaatioon", "slides": [{"src": "slides/01.html", "title": "Kehotteesta automaatioon", "note": "9.00–9.02 · Kari vetää (ehdotus)\nToivota osallistujat tervetulleiksi ja esittele yhdellä lauseella päivän aihe ja kouluttajat. Ennen alkua Matti on katsonut aamulla vastanneiden listan, ja aineiston varakanava (muistitikut tai lyhyt linkki heijastimella) on valmiina. Tekoälyä vähän käyttäneet istuvat kokeneemman viereen ja lähelle kiertävää kouluttajaa. Nimiä ei kirjata aineistoon."}, {"src": "slides/02.html", "title": "Mikä agentti on?", "note": "9.02–9.05 · Kari vetää (ehdotus)\nNäytä määritelmä ja kerro, että Virtaama Oy on keksitty koulutusyritys, jonka tiedot ovat vain aineistossa. Sano: ”Agentti on tekoäly, jolle voi antaa tehtävän hoidettavaksi.” ”Katsokaa demosta kolme asiaa: mikä tehtävä annettiin, mitä agentti teki itse ja missä ihminen päätti.” ”Koko päivän työnjako on sama: tekoäly tekee, sinä tarkistat.” Käsite: agentista käytetään samaa määritelmää koko päivän."}, {"src": "slides/03.html", "title": "Demo: Agentti käyttää tietokonetta", "note": "9.05–9.17 · Matti näyttää demon, Kari päättää hyväksyntäkohdassa (ehdotus)\nDia näkyy vain ennen demoa. Sano: ”Annan agentille tavoitteen, en vaiheita. Katsokaa, mitä se tekee itse ja missä se pysähtyy.” Osoita demon aikana, kun agentti avaa viestin ja hinnaston. Kun luonnoksessa näkyy hinta, sano: ”Agentti löysi hinnan, koska sillä on hinnasto.” Hyväksyntäkohdassa Kari lukee luonnoksen ääneen ja hyväksyy sen. Näytä, että luonnostiedosto syntyy vasta sen jälkeen, ja sano: ”Agentti pysähtyi, koska määritys käskee.” Demon jälkeen: ”Mitään ei lähetetty. Iltapäivällä rakennatte saman määrityksen omaan projektiinne. Siellä agentti ei avaa tiedostoja itse, mutta se tekee samat vaiheet ja pysähtyy samaan kohtaan.” Huomio: demo on ehdotus. Työkalu, vetäjä ja demon tehtävä ovat vielä päättämättä. Varasuunnitelma: jos demo ei käynnisty kahdessa minuutissa, näytä tallenne ja kerro siitä ääneen."}, {"src": "slides/04.html", "title": "Mitä näit?", "note": "9.17–9.20 · Kari vetää (ehdotus)\nKysy: ”Mikä tehtävä agentille annettiin?” Haetaan tavoitetta, ei vaiheita. ”Mitä agentti teki itse?” Haetaan: avasi viestin, haki hinnaston ja kirjoitti luonnoksen. ”Missä ihminen päätti?” Haetaan hyväksyntäkohtaa. Lopuksi sano: ”Agentille annetaan tehtävä, mutta ei avaimia kaikkeen.”"}, {"src": "slides/05.html", "title": "Päivän neljä osaa", "note": "9.17–9.20 · Kari vetää (ehdotus)\nKerro päivän neljä osaa yhdellä lauseella. Ensin katsotaan, mitä agentit ovat. Sitten agentille annetaan tehtävä sekä tiedot ja rajat, ja lopuksi jokainen tekee oman agentin. Huomio: dioille 4 ja 5 on yhteensä kolme minuuttia. On vielä sopimatta, jätetäänkö tämä dia pois, jos aika ei riitä. Jos dia jätetään pois, osallistujat näkevät päivän osat sivuston osavalitsimesta."}, {"src": "slides/06.html", "title": "Tehtävä 2: Kysy hintaa ilman hinnastoa", "note": "9.20–9.25 · Kari vetää, Matti kiertää neuvomassa (ehdotus)\nHinta tai ”ei hintaa” kirjoitetaan paperille ennen kuin hinnasto avataan. Kun suurin osa on saanut vastauksen, pyydä avaamaan hinnasto.md. Näytä silloin, että demon 1 380 € on puolipäivän hinta ja kysymys koski koulutuspäivää. Matti kiertää neuvomassa. Hinnaston mukaan koulutuspäivä maksaa 2 380 € ilman arvonlisäveroa. Jos palvelu ei vielä toimi, osallistuja katsoo vierustoverin vastausta. Varasuunnitelma: jos verkko ei toimi, Kari tekee tehtävän heijastimella puhelimen yhteydellä tai näyttää kuvakaappaukset."}, {"src": "slides/07.html", "title": "Mistä vastaus tuli?", "note": "9.25–9.27 · Kari vetää (ehdotus)\nPyydä kädennostoja. Kolme osallistujaa sanoo lukunsa ennen kuin näytät hinnaston. Jos kenenkään tekoäly ei keksinyt hintaa, kerro, että tekoäly kirjoittaa joskus uskottavan vastauksen ilman lähdettä. Sellaista sanotaan keksityksi vastaukseksi. Lopeta: ”Kenenkään vastaus ei tullut Virtaaman hinnastosta, koska tekoälyllä ei ollut sitä. Tehtävän voi antaa hoidettavaksi vasta, kun annat tiedot. Siihen palataan osassa 3.” Huomio: testissä 13.11.2026 ChatGPT ei keksinyt hintaa. Siksi purkua ei rakenneta keksityn hinnan varaan."}, {"src": "slides/08.html", "title": "Tehtävä 3: Kirjoita tehtävä agentille", "note": "9.27–9.30 · Kari vetää, Matti kiertää neuvomassa (ehdotus)\nMatti kiertää neuvomassa. Jos joku ei keksi tehtävää, kysy, minkä viestin hän kirjoittaa joka viikko lähes samanlaisena. Jos tehtävässä on terveys- tai henkilöstötietoja, aiheeksi otetaan sen pohja tai yleinen ohje. Tehtävä tehdään joka tapauksessa, koska paperia tarvitaan osassa 4."}, {"src": "slides/09.html", "title": "Osa 2: Anna tehtävä", "note": "9.30–9.31 · Kari vetää (ehdotus)\nKerro, että tässä osassa käsitellään määritelmän kohtaa ”antaa tehtävän”. Iltapäivällä saman tehtävän tekee agentti. Riikka Lahtela on Virtaaman asiakaskoordinaattori. Hän hoitaa tarjoukset, laskutuksen ja asiakasviestit, ja käsittelyohjeen vastausluonnokset allekirjoitetaan hänen nimellään."}, {"src": "slides/10.html", "title": "TAKOA", "note": "9.31–9.38 · Kari esittelee TAKOAn (ehdotus)\nKari näyttää viisi vaihetta noin kolmessa minuutissa ja sitten käsittelyohjeen: TAUSTATIEDOT on T, TAVOITE on A ja TÄRKEIN SÄÄNTÖ on K. Älä näytä vielä listaa kolmesta tarkistettavasta tiedosta. O näkyy vain kuvassa. Älä sano, milloin sitä harjoitellaan. ”Tekoäly tuottaa parempaa jälkeä, kun sitä ohjataan kuin osaavaa työkaveria eikä hakukonetta.” ”K-vaiheessa tekoäly kysyy sinulta puuttuvat tiedot ennen kuin se tuottaa mitään.” ”Käsittelyohjeessa tekoäly ei voi kysyä asiakkaalta. Siksi se kirjaa puuttuvat tiedot kenttään, ja sinä kysyt ne asiakkaalta.” Huomio: vielä on päättämättä, tulevatko Karin TAKOA-diat samaan esitykseen. Jos TAKOA venyy, tehtävä 1 alkaa silti klo 9.38."}, {"src": "slides/11.html", "title": "Viestistä tulosteeksi", "note": "9.38–9.39 · Matti vetää (ehdotus)\nKerro minuutissa kolme asiaa. Ohjeessa on kolme vaihetta: luokittele, poimi tiedot ja kirjoita vastausluonnos. JSON on lomake, jossa on kentän nimi ja sen perässä vastaus. Iltapäivän agentti tekee samat kolme vaihetta. Valmis: esitysdiasarjan animoidussa diassa on JSON-esimerkkinä toisen viestin tuloste, joten voit näyttää dian tässä. Huomio: älä näytä ensimmäisen viestin tulostetta ennen tehtävää 1, koska se paljastaisi tehtävän vastauksen."}, {"src": "slides/12.html", "title": "Tehtävä 1: Käsittele ensimmäinen asiakasviesti", "note": "9.39–9.53 · Matti ja Kari kiertävät neuvomassa (ehdotus)\nKatso, että puuttuvien tietojen lista on paperilla ennen kuin viesti annetaan tekoälylle. Tulosteen pitää olla lomake. Jos tekoäly vastaa asiakkaalle suoraan, viesti on liitetty ennen ohjetta tai omana viestinään. Pyydä silloin avaamaan uusi keskustelu. Uusi rivi tulee näppäimillä Shift+Enter, koska pelkkä Enter lähettää viestin. Jos tekoäly täyttää puuttuvan tiedon arvauksella, pyydä näyttämään kohta viestistä ja nosta asia purkuun."}, {"src": "slides/13.html", "title": "Tehtävä 2: Muokkaa ohjetta ja kokeile toisella viestillä", "note": "9.53–10.05 · Matti ja Kari kiertävät neuvomassa (ehdotus)\nKatso, että paperilla on yksi asia kummastakin kohdasta, ohjeessa on yksi muutos ja ohje on tallennettu tiedostoon. Jos kentät muuttuvat, osallistuja on muuttanut kohtaa TULOSTE. Virtaaman viesteissä muokataan vain sävyä, allekirjoitusta tai tavoitetta. Jos aika loppuu, yksi muutos ja tallennettu ohje riittävät. Kun tulosteet ovat valmiit, sano: ”Aamun demossa luonnoksessa oli hinta, koska agentilla oli hinnasto. Käsittelyohjeessa hinnastoa ei ole, joten luonnos lupaa tarjouksen. Tiedot annetaan osassa 3.”"}, {"src": "slides/14.html", "title": "Mitä viestistä puuttui?", "note": "10.05–10.15 · Matti vetää (ehdotus)\nEnsimmäisellä kysymyksellä haetaan: tekoäly voi arvata, vaikka ohje kieltää, ja sen huomaa vain lukemalla viestin itse. Toisella haetaan K eli Kysy ennen kuin tuotat. Kolmannessa jokainen kirjoittaa ohjeen viereen yhden oman viestityypin, ja kaksi sanoo omansa ääneen. Lopeta: ”Tallennettu ohje on tapa antaa tehtävä. Iltapäivällä se on agentin määrityksen ydin.” Jos aika loppuu, purku lyhenee neljään minuuttiin, mutta kysymys omasta viestistä kysytään aina."}, {"src": "slides/15.html", "title": "Osa 3: Anna tiedot ja rajat", "note": "10.25–10.26 · Matti vetää (ehdotus)\nKerro, että tässä osassa käsitellään määritelmän kohtaa ”hoidettavaksi”. Tehtävän voi jättää tekoälyn hoidettavaksi vasta, kun sillä on tarvittavat tiedot. Ennen lounasta tekoälylle annetaan tiedot. Lounaan jälkeen agentille annetaan rajat, ja se testataan."}, {"src": "slides/16.html", "title": "Tehtävä 1: Luo projekti ja tallenna siihen ohje", "note": "10.26–10.40 · Matti näyttää heijastimella, Kari kiertää neuvomassa (ehdotus)\nSano ennen ensimmäistä tiedostolisäystä: ”ChatGPT:n ilmaisella tunnuksella voi lisätä kolme tiedostoa päivässä. Lisätkää tässä osassa tiedostona vain raportti. Muistiinpanot ja taulukko liitetään tekstinä. Näin tiedostolisäyksiä riittää vielä iltapäivän agentin ja oman agentin tietopohjaan.” Näytä askeleet ChatGPT:ssä. Askeleiden 1–4 jälkeen kysy: ”Kenellä ei ole vielä projektia, jossa on kohta ohjeille?” He siirtyvät sivun kohtaan Jos palvelussasi ei ole projekteja, ja Kari käy ensin heidän luonaan. Näytä sitten Clauden projektinäkymä omalta tililtäsi. Jos tehtävä venyy yli klo 10.45, A1 ja B1 lyhenevät viiteen minuuttiin."}, {"src": "slides/17.html", "title": "Valitse polku", "note": "10.40–10.41 · Matti vetää (ehdotus)\nSano klo 10.40: ”Nostakaa käsi, jos valitsette polun B. Polun B tekijät siirtyvät salin toiseen laitaan, jotta Kari voi näyttää heille kaavan. Jos ette osaa valita tai tekoäly on teille uusi, valitkaa A ja tehkää A1 ja A2:n askeleet 1–4.”"}, {"src": "slides/18.html", "title": "Polku A: Tehtävälista ja tarkistus", "note": "10.41–11.15 · Matti ohjaa polkua A (ehdotus)\nA1: tarkista vain muoto. Listassa on kolme osaa, ja jokaisella tehtävällä on vastuuhenkilö. Merkintä ”ei kirjattu” kelpaa. A2: oikealla tiellä on se, joka katsoo kaksi sivuviitettä itse raportista. Jos tarkistaja kuittaa kaiken tai löytää vain toisen ristiriidan, ohjaa osallistuja sivun A2:n askeleeseen 5. Väärä sivunumero on löytö. Jos takarajan siirto on kirjattu ristiriidaksi, kysy: onko muutoksesta tehty päätös? Älä kerro ristiriitoja ennen purkua. Jos aika loppuu, A1 lopetetaan klo 10.50."}, {"src": "slides/19.html", "title": "Polku B: Analyysi ja kaava", "note": "10.41–11.15 · Kari ohjaa polkua B (ehdotus)\nB1: jos tekoäly kertoo poikkeaman syyn varmana tietona, se arvaa. Syy ei ole tiedostossa. B2: jos useampi osallistuja jumittaa, kirjoita kaava pienryhmälle mutta älä hyväksy sitä, jotta tulos ei näy. Tärkein asia: kaavasta näet, mistä soluista luku tulee, mutta tekoälyn luvusta et näe. Jos luvut ovat samat, muistuta, että kuudella rivillä virhe on harvinainen mutta kuudellasadalla ei. Huomio: Kari näyttää kaavan polun B ryhmälle, jos sitä tarvitaan."}, {"src": "slides/20.html", "title": "Mistä tarkistit?", "note": "11.15–11.25 · Matti purkaa polun A, Kari polun B (ehdotus)\nPolku A (Matti, 4 min): näytä ristiriidat lähteistä. Väärä sivunumero on keksitty vastaus. Jos kenelläkään ei ollut väärää sivunumeroa, kerro, että testissä tarkistaja antoi budjetille sivun 2, ja näytä raportin sivu 1. Polku B (Kari, 4 min): kaavan tulos on 4 900 €. Kerro tieto, jota aineistossa ei ole: huhtikuun kuluissa on kertaluonteinen 5 400 euron laitehankinta. Huolestuttavampi on kesäkuu: hiljainen kesä toistuu, mutta hankinta tehdään vain kerran. Kysy: mistä tekoäly tiesi huhtikuun syyn? Ei mistään. Yhteinen kysymys (Matti, 2 min): sivuviite ja luku ovat väitteitä, ja lähde tai kaava ratkaisee. Tarina: näin tämä koulutus tehtiin. Tekoäly kirjoitti aineiston, toinen tekoäly luki sen ensikertalaisen silmin, ja kaksi tarkistajaa palautti työn. Valmis: poikkeamista on animoitu dia."}, {"src": "slides/21.html", "title": "Lounaan jälkeen rakennetaan agentti", "note": "11.25–11.30 · Matti vetää (ehdotus)\nSano: ”Tehtävän voi antaa hoidettavaksi vasta, kun tekoälyllä on tiedot. Tiedot eivät silti takaa, että tulos on oikein, joten tarkistus jää sinulle. Mistä lähteestä sinä tarkistaisit tuloksen omassa työssäsi?” Tarina: Matin oma agentti ei muista eilistä. Se lukee tallennetut muistiinpanonsa. Jos joku on huomannut ChatGPT:n muistavan hänet, palvelu on lisännyt tallentamiaan muistiinpanoja konteksti-ikkunaan eli siihen, minkä tekoäly näkee."}, {"src": "slides/22.html", "title": "Agentilla on tehtävä, tiedot ja rajat", "note": "12.15–12.17 · Matti vetää (ehdotus)\nKerro, että tässä osassa jatkuu määritelmän kohta ”hoidettavaksi”: rajat ja testit kertovat, voiko tehtävän jättää agentin hoidettavaksi. Kerro, että projektin agentti ei tee mitään itsestään eikä lähetä mitään. Sama määritys siirtyy kuitenkin agentille, jolla on työkalut. Tarina: agentti julkaisi demosivun oikean sivun päälle. Kerro se vain, jos siitä on sovittu eikä opiskelijaa tai ryhmää voi tunnistaa."}, {"src": "slides/23.html", "title": "Tehtävä 1: Rakenna Virtaaman asiakasviestiagentti", "note": "12.17–12.35 · Matti aloittaa, sitten molemmat kiertävät neuvomassa (ehdotus)\nSano ennen kuin kukaan lisää tiedostoa: ”ChatGPT:n ilmaisella tunnuksella tietopohja lisätään yhtenä tiedostona tietopohja-yhdistetty.md. Määritys ja tietopohja eivät mahdu yhdessä projektin ohjeisiin, koska sinne mahtuu 8 000 merkkiä.” ”Jos palvelu tarjoaa painiketta Yhdistä sähköposti, älä paina sitä. Agentti ei lähetä mitään. Kopioit luonnoksen itse, kun olet hyväksynyt sen.” Vertailussa oikealla tiellä on se, joka nimeää jotain, mitä aamun ohje ei tehnyt."}, {"src": "slides/24.html", "title": "Tehtävä 2: Testaa agentti kolmella viestillä ja korjaa", "note": "12.35–12.50 · Matti ja Kari kiertävät neuvomassa (ehdotus)\nKatso jo testeissä, onko luonnoksessa hinta tai palvelu, jota tietopohjassa ei ole. Tieto voi olla peräisin verkosta. Testi 1 menee läpi, kun kolme asiaa toteutuu. Luonnoksessa on 2 380 € ja tieto, että hinta on ilman arvonlisäveroa. Lähteeksi on nimetty hinnasto. Agentti pysähtyy pyytämään hyväksynnän. Jos agentti antaa lopullisen viestin kysymättä hyväksyntää, testi on hylätty, vaikka sisältö olisi oikein. Se on hyvä löytö."}, {"src": "slides/25.html", "title": "Hankala asiakas", "note": "12.50–13.00 · Matti vetää, Kari esittää hankalaa asiakasta (ehdotus)\nKari sanoo viestin ääneen, ja Matti näyttää sen kirjoitettuna. Järjestys on 1, 3, 4, 2. Pohjan kohtaa Lisäviestit ei avata, koska siinä näkyy odotettu tulos. Kysy: ”Kenen agentti lupasi jotain, mitä sen ei pitänyt luvata? Kenen agentti ei pysähtynyt pyytämään hyväksyntää?” Kirjaa nostetut kädet. Viestin 1 jälkeen: ”Hyvä luonnos kertoo varausehdon aina ja jättää päivän tarkistamisen ihmiselle.” Kysy: ”Sanooko luonnoksenne, että 12. joulukuuta voi sopia? Tänään se on kymmenen päivän päässä, joten kolmen viikon ehto ei täyty.” Jos aika loppuu, käy läpi vain viestit 1 ja 3."}, {"src": "slides/26.html", "title": "Korjaa ja testaa uudelleen", "note": "13.00–13.10 · Matti näyttää kerran, molemmat kiertävät neuvomassa (ehdotus)\nNäytä kerran heijastimelta, miten virke lisätään tekstieditorin kautta. Virke tulee osan RAJAT viimeiseksi riviksi ennen otsikkoa TULOSTEMUOTO. ChatGPT:ssä kopioidaan kentän koko teksti tekstieditoriin, lisätään virke ja liitetään teksti takaisin vanhan tilalle. Tarina: oman kirjoitustyylin opettaminen tekoälylle vaati kolme korjauskierrosta, ennen kuin teksti kuulosti omalta. Jokainen tekee joka tapauksessa yhden korjauksen ja antaa sen jälkeen saman testin uudelleen."}, {"src": "slides/27.html", "title": "Missä agentti piti ja missä se petti?", "note": "13.10–13.15 · Matti vetää (ehdotus)\nEnsimmäisellä kysymyksellä haetaan: agentti haki tiedot tietopohjasta ja kertoi lähteen. Se myös pysähtyi pyytämään hyväksynnän ja antoi sen jälkeen lopullisen viestin ja seurantarivin. Toisella haetaan: sama testi annettiin uudelleen. Sama viesti voi silti tuottaa eri kerralla eri tuloksen. Siksi testit tehdään uudelleen aina, kun määritystä tai tietopohjaa muutetaan. Lopeta: ”Mitä sinun agenttisi ei saa luvata? Kirjoita se ylös osaa 4 varten.”"}, {"src": "slides/28.html", "title": "Osa 4: Oma agentti", "note": "13.25–13.27 · Matti vetää (ehdotus)\nKerro, että tässä osassa käsitellään määritelmän kohtaa ”voi antaa”. Esittele minuutissa viisi aihiota: asiakasviestien käsittelijä, sisältöagentti, tarjousagentti, raporttiagentti ja ohjeagentti. Sano kustakin yhdellä virkkeellä, kenelle se sopii. ”Oman agentin määritys tehdään haastattelulla: tekoäly kysyy ensin puuttuvat tiedot, yksi kysymys kerrallaan.” Sano tietosuojaraja ääneen: ”Terveys- ja valmennusalan asiakasseurannasta rakennetaan tänään vain versio, jossa ei ole asiakkaiden tietoja.”"}, {"src": "slides/29.html", "title": "Tehtävä 1: Valitse aihe ja täytä agenttikortti", "note": "13.27–13.40 · Matti ja Kari kiertävät neuvomassa (ehdotus)\nHuomio: kerro ääneen, mitä tietoja agenttiin ei saa laittaa, ennen kuin kukaan kokoaa tietopohjaa. Katso, että aihio on valittu ja tehtävä on yhdessä virkkeessä (”Agenttini … ja se työskentelee … apuna”). Ohjaa HR- ja taloustyöntekijät käyttämään keksittyä tietopohjaa. Jos omaa aineistoa ei ole koneella, tietopohjan voi kirjoittaa muistista. Tarina (Matin oma esimerkki, Matti tarkistaa yksityiskohdat): Matin rutiini saa lukea ja ilmoittaa, mutta lupa tarvitaan ennen kuin viesti lähtee toiselle ihmiselle, jotain varataan tai meno perutaan. Sama raja kirjoitetaan korttiin kohtaan Tärkeimmät rajat."}, {"src": "slides/30.html", "title": "Tehtävä 2: Rakenna agentti pohjasta", "note": "13.40–14.15 · Matti ja Kari kiertävät neuvomassa (ehdotus)\nTarkista neljä asiaa: haastattelu tehdään Virtaaman projektin ulkopuolella, määrityksessä on hyväksyntävaihe, osaa Testit ei ole liitetty ohjeisiin ja testien odotetut tulokset vastaavat osallistujan tietopohjaa. Jos tekoäly kirjoittaa määrityksen ennen kysymyksiä, osallistuja kirjoittaa: ”Kysy ensin, yksi kysymys kerrallaan.” Jos Tallenna ei toimi, teksti on liian pitkä. Huomio: haastattelukehotetta ei ole vielä kokeiltu missään palvelussa."}, {"src": "slides/31.html", "title": "Parien muodostaminen", "note": "14.10–14.15 · Matti vetää (ehdotus)\nKlo 14.10 kysy, kenen agentti on pysähtynyt testissä pyytämään hyväksynnän. Parit muodostetaan niin, että jokaisessa parissa on vähintään yksi valmis agentti. Jos osallistujia on pariton määrä, yksi liittyy johonkin pariin kolmanneksi. Sano: ”Pari istuu sinun koneesi ääreen ja antaa viestit. Sinä seuraat vierestä ja merkitset tulokset korttiin. Kouluttaja ilmoittaa vaihdosta klo 14.25.” Huomio: parien muodostaminen on ehdotus."}, {"src": "slides/32.html", "title": "Tehtävä 3: Testaa parin kanssa ja korjaa yksi asia", "note": "14.15–14.45 · Matti ja Kari kiertävät neuvomassa (ehdotus)\nKatso, että pari liittää vain testiviestin eikä odotettua tulosta. Kolmannessa testissä viestin sisällä on käsky agentille. Ilmoita vaihdosta klo 14.25. Yksin tekevä antaa testiviestit itse. Jos parin kumpikaan agentti ei ole valmis, pari testaa Virtaaman agenttia. Huomio: kysy lupa kolmelta esittelijältä klo 14.35 mennessä. Valitse ainakin yksi agentti, jonka testi ei mennyt läpi tai jota korjattiin. Jos aika loppuu, korjaus jätetään pois ja kirjataan korttiin seuraavaksi askeleeksi."}, {"src": "slides/33.html", "title": "Kolme agenttia", "note": "14.45–14.50 · Matti vetää (ehdotus)\nEsittelijät vastaavat paikaltaan ilman heijastinta. Ensimmäisellä kysymyksellä haetaan tehtävää, tietopohjaa ja rajoja yhdellä virkkeellä. Toisella haetaan löytöjä. Korjausvirkkeet lisätään yksi kerrallaan. Kesken jäänyttä työtä ei jatketa lopetuksessa, vaan se kirjataan korttiin seuraavaksi askeleeksi. Huomio: kolmen agentin esittely on ehdotus."}, {"src": "slides/34.html", "title": "Määritelmä uudelleen", "note": "14.50–14.52 · Matti vetää (ehdotus)\nPyydä osallistujia lukemaan määritelmä oman agenttinsa kannalta. Sano sitten: ”Teidän agenttinne tekee vaiheet, kun annatte sille työn, ja pysähtyy pyytämään hyväksynnän. Se ei avaa tiedostoja, ei lähetä mitään eikä tee mitään itsestään. Ja se voi erehtyä. Sama määritys siirtyy sellaisenaan agentille, jolla on työkalut. Sellaisen näitte aamun demossa.”"}, {"src": "slides/35.html", "title": "Kortin loppu: Seuraavat 30 päivää", "note": "14.52–14.57 · Kari vetää (ehdotus)\nKari sanoo: ”Täyttäkää kohdat Missä agentti on, Seuraava askel 30 päivän aikana ja Mistä huomaan hyödyn. Kirjoittakaa seuraavaan askeleeseen myös päivä.” Kaksi osallistujaa kertoo omansa. Jos oma agentti jäi kesken, seuraava askel on yleensä määritys haastattelukehotteella ja kolme omaa testiä. Kortti täytetään aina, eikä lopetuksen 15 minuuttia lyhennetä."}, {"src": "slides/36.html", "title": "Kiitos", "note": "14.57–15.00 · Matti ja Kari päättävät päivän (ehdotus)\nPyydä tarkistamaan, että tallessa ovat oma käsittelyohje, Virtaaman agentti, oman agentin määritys, kortti ja pohjat. Matti sanoo: ”Kun rakennatte agentin omaan työhönne, älkää laittako siihen asiakkaiden nimiä, yhteystietoja, terveystietoja tai henkilöstötietoja. Tarkistakaa oman organisaationne ohjeet ennen kuin käytätte agenttia oikeaan työhön. Katsokaa myös palvelunne tietosuoja-asetuksista, käytetäänkö keskustelujanne mallin kehittämiseen.” Kerro lisäharjoituksista. Kari sanoo: ”Kiitos päivästä. Tarkistaminen on se osa, jota tekoäly ei tee puolestanne.”"}]}</script>
