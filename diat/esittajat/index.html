<script type="application/json" id="dia-data">{"title": "Esittäjien diat · Kehotteesta automaatioon", "slides": [{"src": "slides/01.html", "title": "Kehotteesta automaatioon", "note": "Tervetuloa. Esittelemme koulutuspäivän Kehotteesta automaatioon: miten päivä etenee, mitä osallistujat tekevät ja miten kouluttajat jakavat työn. Koulutus on 2.12.2026 klo 9–15, ja ilmoittautuneita on noin 22. Tavoitteena on, että jokaisella on päivän päätteeksi testattu agentti omaa työtään varten."}, {"src": "slides/02.html", "title": "Sama yritys ja sama määritelmä kulkevat mukana koko päivän", "note": "Koko päivä tehdään yhden keksityn yrityksen, Virtaama Oy:n, aineistolla, ja jokainen osa alkaa samalla määritelmällä. Kun aineisto ei vaihdu, osallistujan ei tarvitse opetella uutta esimerkkiä joka osassa. Tehtäviä on kaikkiaan 15, mutta osan 3 alkupuolella osallistuja valitsee polun A tai B, joten hän tekee niistä 13. Opetusaikaa on 295 minuuttia. Osallistuja vie mukanaan oman käsittelyohjeen, testatun agentin ja agenttikortin, jonka avulla hän jatkaa seuraavana päivänä."}, {"src": "slides/03.html", "title": "Agentti on tekoäly, jolle voi antaa tehtävän hoidettavaksi.", "note": "Määritelmä on päivän punainen lanka: agentti on tekoäly, jolle voi antaa tehtävän hoidettavaksi. Jokaisessa osassa korostetaan yhtä sen kohtaa. Osa 1 näyttää koko määritelmän, osa 2 kohdan \"antaa tehtävän\", osa 3 kohdan \"hoidettavaksi\" ja osa 4 kohdan \"voi antaa\". Osa 3 jakautuu lounaan kohdalta kahtia, ja osan 4 aikaan sisältyy lopetus klo 14.45–15.00."}, {"src": "slides/04.html", "title": "Mitä ennakkokysely kertoo", "note": "Ennakkokyselyyn vastasi 13 osallistujaa 22:sta. Useimmat vastaajat käyttävät tekoälyä jo viikoittain, ja kuudella on maksullinen ChatGPT. Eniten toivottiin agentteja. Ilmoittautuneista suurin osa tulee liikunnan ja hyvinvoinnin sekä luovan alan ja median yrityksistä, ja kaksi kolmasosaa yksin- tai pienyrityksistä. Osa käsittelee työssään terveys- ja henkilöstötietoja, joten tietosuojaraja sanotaan ääneen osan 4 alussa. Vasta aloittaneet istuvat kokeneempien vieressä."}, {"src": "slides/05.html", "title": "Päiväohjelma 2.12.", "note": "Päivä alkaa klo 9 ja päättyy klo 15. Lounas on klo 11.30–12.15, ja aamu- ja iltapäivällä on kymmenen minuutin tauot. Osa 3 jakautuu lounaan kohdalta: ennen sitä tekoälylle annetaan tiedot ja sen jälkeen rajat ja testit. Lopetuksen 15 minuuttia pidetään aina, vaikka jostain muusta jouduttaisiin karsimaan."}, {"src": "slides/06.html", "title": "Osien 1–3 harjoitukset tehdään Virtaama Oy:n aineistolla", "note": "Virtaama Oy on keksitty kuuden hengen koulutus- ja konsultointiyritys Tampereelta. Aineistossa on hinnasto, asiakasviestit, raportti, palaverimuistiinpanot, taloustaulukko ja agentin tietopohja. Siihen on tarkoituksella piilotettu ristiriitoja: raportissa ja muistiinpanoissa on eri budjetti, vastuuhenkilö vaihtuu ilman päätöstä, ja taulukossa on kulupiikki ja tappiollinen kuukausi. Niiden avulla osallistuja oppii tarkistamaan tekoälyn tuloksen lähteestä. Osassa 4 Virtaamaa ei enää käytetä, vaan jokainen kokoaa tietopohjan omasta työstään ilman henkilötietoja."}, {"src": "slides/07.html", "title": "Mitä agentit ovat?", "note": "Osa 1 alkaa määritelmällä ja demolla. Kouluttaja antaa agentille tavoitteen, ei vaiheita. Agentti avaa Virtaaman asiakasviestin ja hinnaston itse, kirjoittaa luonnoksen ja pysähtyy pyytämään hyväksyntää. Mitään ei lähetetä. Osallistujat kirjaavat demosta, mitä agentti teki itse ja missä ihminen päätti. Sen jälkeen he kysyvät tekoälyltä Virtaaman hintaa antamatta sille hinnastoa ja huomaavat, ettei tekoäly voi tietää oikeaa hintaa ilman lähdettä. Lopuksi jokainen kirjoittaa paperille työtehtävän, jonka antaisi agentille. Paperi otetaan esiin osassa 4."}, {"src": "slides/08.html", "title": "Agentti käyttää tietokonetta", "note": "Dia näyttää demon suunnitellun kulun kuutena vaiheena. Kouluttaja antaa tavoitteen. Agentti avaa viestin ja hakee hinnaston itse. Se näyttää luonnoksen, jossa hinta on 1 380 € ilman arvonlisäveroa ja lähteenä on hinnasto. Sitten se pysähtyy kysymään, hyväksytäänkö luonnos. Tallennus tehdään vasta hyväksynnän jälkeen, eikä mitään lähetetä. Iltapäivällä osallistujat rakentavat saman määrityksen omaan projektiinsa."}, {"src": "slides/09.html", "title": "Anna tehtävä käsittelyohjeella", "note": "Osassa 2 tekoälylle annetaan tehtävä käsittelyohjeella. Animaatio etenee vaiheittain: ensin asiakkaan viesti, sitten ohjeen kolme vaihetta, tulosteen kentät, puuttuvat tiedot, vastausluonnos ja lopuksi ihmisen tarkistus. Ohje pitää tulosteen kentät samoina. Kuvassa on toinen asiakasviesti, sama kuin aamun demossa. Kari näyttää aluksi TAKOA-mallin ja sen, miten malli näkyy ohjeessa. Tehtävässä 1 osallistuja kirjoittaa ensin itse, mitä tietoja viestistä puuttuu, ja vertaa omaa vastaustaan tekoälyn tulosteeseen. Tehtävässä 2 hän muokkaa ohjetta ja kokeilee sitä toisella viestillä. Osan jälkeen jokaisella on tallessa oma käsittelyohje."}, {"src": "slides/10.html", "title": "Anna tiedot ja tarkista tulos", "note": "Osan 3 alkupuolella tekoälylle annetaan tiedot ja tulos tarkistetaan. Ensin jokainen luo projektin ja tallentaa siihen ohjeen ja raportin samaan tahtiin kouluttajan kanssa. Sitten osallistuja valitsee polun. Polulla A tekoäly tekee raportista tehtävälistan, ja osallistuja tarkistaa sivuviitteet ja ristiriidat itse. Polulla B tekoäly analysoi taulukon, ja osallistuja tarkistaa tuloksen kaavalla. Kummallakin polulla periaate on sama: jos tekoälyn tulos ja lähde eroavat, lähde ratkaisee. Jos osallistuja ei osaa päättää, hän valitsee polun A."}, {"src": "slides/11.html", "title": "Polku B: taulukon analyysi", "note": "Polun B kaavio näyttää Virtaaman myynnin ja kulut puolen vuoden ajalta. Ensin pylväät kasvavat, ja sitten kaksi poikkeamaa korostuu: huhtikuun kulupiikin ja tappiollisen kesäkuun. Tekoäly huomaa poikkeamat, mutta se ei voi tietää niiden syytä, jos sitä ei ole kerrottu tiedostossa. Osallistuja laskee tuloksen itse kaavalla. Oikea tulos on 4 900 € eli 6,4 % myynnistä. Kaavasta näkee, mistä soluista luku tulee, mutta tekoälyn luvusta sitä ei näe."}, {"src": "slides/12.html", "title": "Anna rajat ja testaa", "note": "Lounaan jälkeen osallistujat rakentavat Virtaaman asiakasviestiagentin valmiista määrityksestä ja testaavat sen kolmella viestillä. Ensimmäisellä viestillä selvitetään, hakeeko agentti hinnan hinnastosta. Toisella selvitetään, lupaako agentti jotain, mitä yritys ei voi toteuttaa, ja kolmannella, totteleeko se asiakkaan viestiin kirjoitettua käskyä. Jokaisessa testissä agentin pitää pysähtyä pyytämään hyväksyntää. Testien jälkeen Kari esittää hankalaa asiakasta, ja kaikki antavat samat viestit omalle agentilleen. Lopuksi jokainen tekee yhden korjauksen: lisää määritykseen yhden virkkeen ja antaa saman testiviestin uudelleen."}, {"src": "slides/13.html", "title": "Oma agentti", "note": "Osassa 4 jokainen rakentaa agentin omaan työhönsä. Aiheena on aamulla paperille kirjoitettu tehtävä. Osallistuja valitsee viidestä aihiosta lähimmän, ja tekoäly haastattelee häntä, ennen kuin kirjoittaa määrityksen. Pari testaa agentin, ja osallistuja tekee yhden korjauksen. Kaikki kirjataan agenttikorttiin: tehtävä, tietopohja, rajat, testien tulos ja seuraava askel. Asiakkaiden tietoja ei käytetä, ja terveys- ja valmennusalan asiakasseurannasta tehdään versio ilman niitä. Lopetukseen varataan aina 15 minuuttia."}, {"src": "slides/14.html", "title": "Agentista linjastoon", "note": "Lopetus selittää koulutuksen nimen. Osassa 2 opitaan kirjoittamaan kehote, osissa 3 ja 4 siitä tehdään agentti, ja lopetuksessa nähdään, miten agenteista rakennetaan linjasto eli automaatio. Ensin kaksi osallistujaa esittelee agenttinsa, ja sitten näytetään kolme lukua esityksestä Pedagoginen agenttiputki. Yleisagentti, esimerkiksi Claude Cowork, päättää itse, miten se etenee, joten tyyli ja sisältö vaihtelevat kerrasta toiseen. Yleisagentti sopii työhön, joka tehdään kerran tai joka on aina erilainen. ChatGPT:n dot on Suomessa käytännössä vain organisaatioiden tilauksissa, eikä osallistujan tarvitse hankkia sitä. Linjastossa vaiheet ja tarkastus päätetään etukäteen, ja ihminen hyväksyy lopputuloksen. Linjasto sopii toistuvaan työhön, jonka laatu ja tyyli on pidettävä hallinnassa. Sekään ei kirjoita joka kerta samaa tekstiä, mutta jokainen vaihe tarkistetaan. Lopuksi jokainen kirjaa korttiin seuraavan askeleen päivämäärineen."}, {"src": "slides/15.html", "title": "Määrityksessä on kuusi osaa, joista viisi liitetään projektiin", "note": "Agentin määrityksessä on kuusi osaa. Viisi ensimmäistä liitetään projektin ohjeisiin. Testit-osan tekijä pitää itsellään, koska agentti ei saa nähdä odotettuja tuloksia. Toimintalogiikassa on aina vaihe, jossa agentti pysähtyy pyytämään hyväksyntää. Osassa 3 osallistuja käyttää valmista Virtaaman määritystä, ja osassa 4 hän tekee omansa samalla pohjalla. Vapaaehtoisessa lisäharjoituksessa määrityksen voi viedä esimerkiksi Clauden skilliksi."}, {"src": "slides/16.html", "title": "Mitä agentti tekee itse?", "note": "Dia kokoaa päivän kolme agenttia. Projektiin rakennettu agentti tekee vaiheet, kun käyttäjä antaa sille työn, ja pysähtyy pyytämään hyväksyntää. Se ei avaa tiedostoja koneelta eikä lähetä mitään, ja se voi erehtyä. Demon yleisagentti avaa tiedostot itse, mutta tallentaa vasta hyväksynnän jälkeen. Linjastossa on monta asemaa, ja työ tarkistetaan niiden välissä. Saman määrityksen voi antaa sellaisenaan yleisagentille. Agentille annetaan tehtävä, mutta ei avaimia kaikkeen."}, {"src": "slides/17.html", "title": "TAKOA kulkee mukana koko päivän", "note": "TAKOA on Karin malli tekoälyn ohjaamiseen. Kari esittelee sen osan 2 alussa ja näyttää, missä kohdin käsittelyohjetta vaiheet ovat: taustatiedot, tavoite ja sääntö, jonka mukaan puuttuva tieto kirjataan eikä sitä arvata. Vaihe \"Kysy ennen kuin tuotat\" näkyy myös osan 4 haastattelukehotteessa. \"Arkistoi onnistuminen\" tarkoittaa toimivan ohjeen tallentamista. Vaihetta \"Optimoi vaihtoehdoista\" harjoitellaan lisäharjoituksissa."}, {"src": "slides/18.html", "title": "Työkalut muuttuvat nyt", "note": "Tekoälytyökalut muuttuvat juuri nyt. Henkilökohtaisilla tileillä ChatGPT:n omia GPT:itä ei voi enää luoda, ja ne poistuvat 11.12.2026. Siksi koulutuksessa ei tehdä GPT:itä eikä Geminin Gemejä. Ilmaisella tunnuksella sekä ChatGPT:ssä että Claudessa toimii projekti, jossa on ohjeet ja tietopohja. Koska se on yhteinen perustaso, jokainen rakentaa agentin projektiin. ChatGPT:n ilmaisella tunnuksella tiedostoja voi lisätä kolme päivässä, joten agentin tietopohja on koottu yhdeksi tiedostoksi."}, {"src": "slides/19.html", "title": "Mitä työkaluja päivän aikana käytetään?", "note": "Koko päivän työkaluna on ChatGPT tai Claude, ja perustehtäviin riittää ilmainen tunnus. Ennakkoviestissä jokaista pyydetään hankkimaan tunnus jompaankumpaan. Jos osallistuja käyttää työssään Geminiä tai Copilotia, hän luo päivää varten ilmaisen tunnuksen ChatGPT:hen tai Claudeen. Demon agentti käyttää tietokonetta ja vaatii maksullisen tilauksen, mutta osallistujat eivät tarvitse sitä. Polulla B tulos tarkistetaan Excelissä tai Google Sheetsissä."}, {"src": "slides/20.html", "title": "Mitä Matti tuo koulutukseen?", "note": "Matti opettaa sitä, mitä tekee jo omassa työssään. Osan 2 käsittelyohje ja agentin määritys ovat samanlaisia järjestelmällisiä ohjeita kuin hänen omansa. Polun A tekijä ja tarkistaja on sama malli, jolla hän tekee opetusmateriaalia agenttien kanssa. Tämän koulutuksen materiaali tehtiin samoin: tekoäly suunnitteli ja kirjoitti, tarkistajat palauttivat työn korjattavaksi, ja lopuksi tehtiin kielenhuolto. Asian voi kertoa omin sanoin noin minuutissa."}, {"src": "slides/21.html", "title": "Työnjako päivän aikana", "note": "Osassa 1 Kari käy läpi määritelmän ja vetää purun, ja Matti näyttää demon. Osassa 2 Kari esittelee TAKOAn, ja Matti vetää tehtävät. Osan 3 alkupuolella Matti ohjaa polkua A ja Kari polkua B. Lounaan jälkeen Kari esittää hankalaa asiakasta. Osan 4 vetää Matti. Lopetuksessa Matti vetää esittelyt ja linjasto-osuuden, ja Kari käynnistää agenttiputken ja vetää seuraavan askeleen. Kun osallistujat rakentavat agenttia, toinen kouluttaja tukee ChatGPT:n ja toinen Clauden käyttäjiä."}]}</script>
